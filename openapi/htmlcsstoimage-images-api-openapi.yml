        template_values:
          description: Values substituted into the template for this render. Must be a non-empty JSON object. Include the values needed by the template.
          $ref: '#/components/schemas/JsonObject'
        format:
          oneOf:
          - type: 'null'
          - description: 'Sets the file extension on the URL returned by the image creation request. It does not change the stored source image or restrict later rendering to this format. Valid values: png, jpg, jpeg, webp, or pdf. This parameter is accepted only in POST request bodies.'
            $ref: '#/components/schemas/ImageFormat'
    ImageBaseImage_Templated:
      title: Templated Image
      properties:
        image_type:
          enum:
          - templated
          type: string
        template_id:
          type: string
          description: ID of the template used to create this image.
        template_version:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          description: Version of the template used to create this image.
          format: int64
        template_values:
          description: Resolved values supplied to the template for this image, keyed by template variable name.
          $ref: '#/components/schemas/JsonObject'
        id:
          type: string
          description: Unique image ID. Use this value to retrieve image metadata or render the image.
        created_at:
          type: string
          description: Date and time the image was created, in UTC.
          format: date-time
        last_render_stored_at:
          type:
          - 'null'
          - string
          description: Last recorded date and time a rendered image was stored by HCTI, in UTC. Null when no stored render timestamp is available. This value can change after rendering again or be cleared when the stored render is removed.
          format: date-time
        og_config_id:
          type:
          - 'null'
          - string
          description: ID of the Open Graph configuration that created this image, or null when the image is not associated with one.
        og_config_content_version:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Content version of the Open Graph configuration associated with this image, or null when unavailable.
          format: int64
        saved_to_storage_destination_at:
          type:
          - 'null'
          - string
          description: Recorded date and time the base image was saved to its configured storage destination, in UTC. Null until a save is recorded; does not describe saves of resized or reformatted variants.
          format: date-time
        storage_destination_hcti_storage_disabled:
          type:
          - 'null'
          - boolean
          description: Whether HCTI storage is disabled for this image, recorded from the storage destination when the image was created. When true, rendered files are saved to the configured storage destination without a public HCTI image URL or HCTI CDN caching.
      description: An image created from a specific template version and resolved template values. The image_type is templated.
    BatchTemplatedImageRequest:
      required:
      - variations
      type: object
      properties:
        default_options:
          oneOf:
          - type: 'null'
