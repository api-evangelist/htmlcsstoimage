components:
  schemas:
    ImageRequest:
      type: object
      anyOf:
      - $ref: '#/components/schemas/ImageRequestImageRequest_HtmlCss'
      - $ref: '#/components/schemas/ImageRequestImageRequest_Url'
      - $ref: '#/components/schemas/ImageRequestImageRequest_Templated'
      discriminator:
        propertyName: $type
    ImageRequestImageRequest_HtmlCss:
      title: HTML/CSS Image Request
      required:
      - html
      properties:
        html:
          type: string
          description: HTML to render and take a screenshot of. HTML fragments are rendered in a wrapper document unless a complete HTML document is supplied. Required for HTML image requests.
        css:
          type:
          - 'null'
          - string
          description: CSS used to style the rendered HTML.
        device_scale:
          maximum: 3
          minimum: 0.1
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          description: 'Adjusts the pixel ratio used for the screenshot. Minimum: 0.1. Maximum: 3. HTML and template renders default to 2; URL renders default to 1.'
          format: double
        google_fonts:
          type:
          - 'null'
          - string
          description: Google fonts to load. Separate multiple fonts with a pipe, such as 'Roboto|OpenSans', and set font-family in the CSS to use them.
        max_wait_ms:
          maximum: 10000
          minimum: 500
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Sets a limit on how long to wait before taking the screenshot when the page continues loading irrelevant content. Minimum: 500. Maximum: 10000 and subject to the account plan limit.'
          format: int32
        metadata:
          type:
          - 'null'
          - object
          additionalProperties:
            type: string
          description: Custom key-value metadata stored with the image.
        ms_delay:
          maximum: 10000
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Adds extra time in milliseconds before taking the screenshot so JavaScript can execute. Minimum: 0. Maximum: 10000.'
          format: int32
          default: 0
        render_when_ready:
          type:
          - 'null'
          - boolean
          description: Waits until the page signals that the screenshot is ready. The image fails if the readiness signal is never sent.
        selector:
          type:
          - 'null'
          - string
          description: A CSS selector for an element in the HTML. We’ll crop the image to this specific element.
        viewport_height:
          maximum: 6000
          minimum: 1
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Sets the height of Chrome''s viewport and disables automatic cropping. Minimum: 1. Maximum: 6000. Both viewport dimensions must be supplied together.'
          format: int32
        viewport_width:
          maximum: 6000
          minimum: 1
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Sets the width of Chrome''s viewport and disables automatic cropping. Minimum: 1. Maximum: 6000. Both viewport dimensions must be supplied together.'
          format: int32
        pdf_options:
          oneOf:
          - type: 'null'
          - description: Options used when generating a PDF instead of an image. Page dimensions and margins must include supported PDF units; margins must contain either zero or four values; scale must be between 0.1 and 2.
            $ref: '#/components/schemas/PDFOptions'
        disable_twemoji:
          type:
          - 'null'
          - boolean
          description: Twemoji is enabled by default. Set true to disable automatic emoji replacement and use the supplied fonts or native emoji fonts instead. Omitted, null, or false keeps Twemoji enabled.
        dedupe_duration_s:
          maximum: 31536000
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Reuse an existing image with identical content if it was created within this many seconds. Minimum: 0. Maximum: 31536000. Availability and maximum effective duration depend on the account plan.'
          format: int32
        max_render_once:
          type:
          - 'null'
          - boolean
          description: Ensure the image is only ever rendered and saved one time. This is an advanced option not applicable to most requests.
        color_scheme:
          oneOf:
          - type: 'null'
          - description: 'Sets Chrome''s preferred color scheme. Valid values: light or dark.'
            $ref: '#/components/schemas/ColorSchemeType'
        timezone:
          type:
          - 'null'
          - string
          description: Sets the IANA timezone used by Chrome while rendering. Must be a recognized IANA timezone identifier.
        viewport_mobile:
          type:
          - 'null'
          - boolean
          description: Specifies whether the page uses mobile viewport behavior, including its viewport meta tag.
        viewport_landscape:
          type:
          - 'null'
          - boolean
          description: Specifies whether the emulated viewport is in landscape orientation.
        viewport_touch:
          type:
          - 'null'
          - boolean
          description: Specifies whether the emulated viewport supports touch events.
        media_type:
          oneOf:
          - type: 'null'
          - description: 'Sets the CSS media type used while rendering the page. Valid values: print or screen.'
            $ref: '#/components/schemas/MediaType'
        proxy_id:
          type:
          - 'null'
          - string
          description: Specifies which configured organization proxy to use when rendering.
        storage_destination_id:
          type:
          - 'null'
          - string
          description: Specifies which configured organization storage destination receives the rendered image.
        jumbo_max_height:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Maximum height of the rendered image in jumbo mode. Jumbo rendering consumes additional renders and requires jumbo_max_width. Supply both jumbo dimensions. Each must be greater than 0 and no more than 80000; at least one must exceed 8000; total area cannot exceed 400000000 pixels.
          format: int32
        jumbo_max_width:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Maximum width of the rendered image in jumbo mode. Jumbo rendering consumes additional renders and requires jumbo_max_height. Supply both jumbo dimensions. Each must be greater than 0 and no more than 80000; at least one must exceed 8000; total area cannot exceed 400000000 pixels.
          format: int32
        transparent_background:
          type:
          - 'null'
          - boolean
          description: Specifies whether the image is rendered with a transparent background.
        format:
          oneOf:
          - type: 'null'
          - description: 'Sets the file extension on the URL returned by the image creation request. It does not change the stored source image or restrict later rendering to this format. Valid values: png, jpg, jpeg, webp, or pdf. This parameter is accepted only in POST request bodies.'
            $ref: '#/components/schemas/ImageFormat'
        request_overrides:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/RequestOverride'
          description: Rules that override browser network requests. The block action blocks requests matching a URL wildcard pattern and/or resource types. When both matchers are supplied, both must match. A request is blocked if any block rule matches. Omitted, null, or an empty array adds no overrides. Requires a paid plan. Accepts a JSON array in JSON requests or a JSON-encoded array string in form requests. Maximum 100 rules and 512 characters per URL pattern. Each block rule requires a nonempty URL pattern or at least one resource type; supplied matchers cannot be empty. Not supported in query strings.
    StoreImageStatus:
      enum:
      - stored
      - already_stored
      - failed
      - not_attempted
    ImagePageResult:
      required:
      - next_page_token
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/SimpleImage'
          description: Image summaries returned on this page.
        next_page_token:
          type: string
          description: Opaque continuation token. Pass this value as page_token to retrieve the next page when has_next_page is true.
        has_next_page:
          type: boolean
          description: Whether another page of results is available.
      description: A page of created images belonging to the authenticated organization, excluding deleted images.
    BatchImageRequest:
      required:
      - variations
      type: object
      properties:
        default_options:
          oneOf:
          - type: 'null'
          - description: Common image options applied to every variation. Options supplied by a variation override these defaults.
            $ref: '#/components/schemas/BaseImageRequest'
        variations:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/ImageRequest'
          description: One variation per image. Supply at least one variation, within your plan's batch limit. Each merged request must provide HTML or a URL. Results preserve this order.
      description: Creates a batch of images from HTML or URLs. Each variation overrides the corresponding default options.
    ImageRequest_TemplatedBatchOptions:
      type: object
      properties:
        template_values:
          oneOf:
          - type: 'null'
          - description: Template variable values shared through default_options or overridden by this variation. Objects merge recursively by key; variation arrays, scalar values and explicit null replace defaults. Values may be shared across different templates. Each merged object must be nonempty and satisfy its resolved template's required variables.
            $ref: '#/components/schemas/JsonObject'
        template_id:
          type:
          - 'null'
          - string
          description: Template ID to render for this variation. Omit to inherit default_options.template_id. Supplying a template_id resets the inherited template_version unless this variation also supplies a version. Each variation must resolve to a nonempty template ID owned by the authenticated organization.
        template_version:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Template version to render. Inherit default_options.template_version when using the default template ID. When supplying a template_id in this variation, omit the version to use that template's latest version.
          format: int64
        format:
          oneOf:
          - type: 'null'
          - description: 'Output format for this variation''s returned image URL. Omit to inherit default_options.format. This does not restrict subsequent rendering to that format. Valid values: png, jpg, jpeg, webp, or pdf.'
            $ref: '#/components/schemas/ImageFormat'
    ImageRequestImageRequest_Url:
      title: URL Image Request
      required:
      - url
      properties:
        url:
          type: string
          description: Public HTTP or HTTPS URL to capture. Required for URL image requests.
        css:
          type:
          - 'null'
          - string
          description: CSS injected into the loaded URL to override styles on the page.
        device_scale:
          maximum: 3
          minimum: 0.1
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
          - 'null'
          - number
          - string
          description: 'Adjusts the pixel ratio used for the screenshot. Minimum: 0.1. Maximum: 3. HTML and template renders default to 2; URL renders default to 1.'
          format: double
        full_screen:
          type:
          - 'null'
          - boolean
          description: Take a screenshot of the entire screen after scrolling down and back to the top.
        max_wait_ms:
          maximum: 10000
          minimum: 500
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Sets a limit on how long to wait before taking the screenshot when the page continues loading irrelevant content. Minimum: 500. Maximum: 10000 and subject to the account plan limit.'
          format: int32
        metadata:
          type:
          - 'null'
          - object
          additionalProperties:
            type: string
          description: Custom key-value metadata stored with the image.
        ms_delay:
          maximum: 10000
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Adds extra time in milliseconds before taking the screenshot so JavaScript can execute. Minimum: 0. Maximum: 10000.'
          format: int32
          default: 0
        render_when_ready:
          type:
          - 'null'
          - boolean
          description: Waits until the page signals that the screenshot is ready. The image fails if the readiness signal is never sent.
        selector:
          type:
          - 'null'
          - string
          description: A CSS selector for an element in the HTML. We’ll crop the image to this specific element.
        viewport_height:
          maximum: 6000
          minimum: 1
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Sets the height of Chrome''s viewport and disables automatic cropping. Minimum: 1. Maximum: 6000. Both viewport dimensions must be supplied together.'
          format: int32
        viewport_width:
          maximum: 6000
          minimum: 1
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Sets the width of Chrome''s viewport and disables automatic cropping. Minimum: 1. Maximum: 6000. Both viewport dimensions must be supplied together.'
          format: int32
        pdf_options:
          oneOf:
          - type: 'null'
          - description: Options used when generating a PDF instead of an image. Page dimensions and margins must include supported PDF units; margins must contain either zero or four values; scale must be between 0.1 and 2.
            $ref: '#/components/schemas/PDFOptions'
        disable_twemoji:
          type:
          - 'null'
          - boolean
          description: Set explicitly to false to inject Twemoji into the loaded page. Omitted, null, or true leaves the page's emoji handling unchanged and does not disable the website's own emoji scripts.
        dedupe_duration_s:
          maximum: 31536000
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: 'Reuse an existing image with identical content if it was created within this many seconds. Minimum: 0. Maximum: 31536000. Availability and maximum effective duration depend on the account plan.'
          format: int32
        max_render_once:
          type:
          - 'null'
          - boolean
          description: Ensure the image is only ever rendered and saved one time. This is an advanced option not applicable to most requests.
        color_scheme:
          oneOf:
          - type: 'null'
          - description: 'Sets Chrome''s preferred color scheme. Valid values: light or dark.'
            $ref: '#/components/schemas/ColorSchemeType'
        timezone:
          type:
          - 'null'
          - string
          description: Sets the IANA timezone used by Chrome while rendering. Must be a recognized IANA timezone identifier.
        block_consent_banners:
          type:
          - 'null'
          - boolean
          description: Attempt to block cookie/consent banners from displaying.
        identify_as_hcti:
          type:
          - 'null'
          - boolean
          description: Identify the top-level page navigation as an HCTI screenshot request using the X-HCTI-SCREENSHOT header.
        headers:
          type:
          - 'null'
          - object
          additionalProperties:
            type: string
          description: HTTP headers to include on top-level page navigations to the requested URL's origin and any additional_header_origins. Supports up to 20 headers with names up to 512 ASCII characters and values up to 8192 UTF-8 bytes. For GET and form-encoded requests, repeat this parameter using the format `headers=name:value`.
        additional_header_origins:
          type:
          - 'null'
          - array
          items:
            type: string
          description: Additional exact HTTP or HTTPS origins allowed to receive custom headers. Supports up to 20 unique origins of up to 512 UTF-8 bytes each. Origins must use the format scheme://host[:port] without a path; duplicates are ignored. For GET and form-encoded requests, repeat this parameter for each origin.
        include_headers_on_subrequests:
          type:
          - 'null'
          - boolean
          description: Include custom headers on subrequests to the requested URL's origin and any additional_header_origins. Defaults to false. Requires at least one header.
        viewport_mobile:
          type:
          - 'null'
          - boolean
          description: Specifies whether the page uses mobile viewport behavior, including its viewport meta tag.
        viewport_landscape:
          type:
          - 'null'
          - boolean
          description: Specifies whether the emulated viewport is in landscape orientation.
        viewport_touch:
          type:
          - 'null'
          - boolean
          description: Specifies whether the emulated viewport supports touch events.
        media_type:
          oneOf:
          - type: 'null'
          - description: 'Sets the CSS media type used while rendering the page. Valid values: print or screen.'
            $ref: '#/components/schemas/MediaType'
        proxy_id:
          type:
          - 'null'
          - string
          description: Specifies which configured organization proxy to use when rendering.
        storage_destination_id:
          type:
          - 'null'
          - string
          description: Specifies which configured organization storage destination receives the rendered image.
        jumbo_max_height:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Maximum height of the rendered image in jumbo mode. Jumbo rendering consumes additional renders and requires jumbo_max_width. Supply both jumbo dimensions. Each must be greater than 0 and no more than 80000; at least one must exceed 8000; total area cannot exceed 400000000 pixels.
          format: int32
        jumbo_max_width:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          description: Maximum width of the rendered image in jumbo mode. Jumbo rendering consumes additional renders and requires jumbo_max_height. Supply both jumbo dimensions. Each must be greater than 0 and no more than 80000; at least one must exceed 8000; total area cannot exceed 400000000 pixels.
          format: int32
        transparent_background:
          type:
          - 'null'
          - boolean
          description: Specifies whether the image is rendered with a transparent background.
        format:
          oneOf:
          - type: 'null'
          - description: 'Sets the file extension on the URL returned by the image creation request. It does not change the stored source image or restrict later rendering to this format. Valid values: png, jpg, jpeg, webp, or pdf. This parameter is accepted only in POST request bodies.'
            $ref: '#/components/schemas/ImageFormat'
        request_overrides:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/RequestOverride'
          description: Rules that override browser network requests. The block action blocks requests matching a URL wildcard pattern and/or resource types. When both matchers are supplied, both must match. A request is blocked if any block rule matches. Omitted, null, or an empty array adds no overrides. Requires a paid plan. Accepts a JSON array in JSON requests or a JSON-encoded array string in form requests. Maximum 100 rules and 512 characters per URL pattern. Each block rule requires a nonempty URL pattern or at least one resource type; supplied matchers cannot be empty. Not supported in query strings.
