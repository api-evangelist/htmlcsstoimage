        schema:
          type:
          - 'null'
          - boolean
      - name: viewport_mobile
        in: query
        description: Specifies whether the page uses mobile viewport behavior, including its viewport meta tag.
        schema:
          type:
          - 'null'
          - boolean
      - name: viewport_landscape
        in: query
        description: Specifies whether the emulated viewport is in landscape orientation.
        schema:
          type:
          - 'null'
          - boolean
      - name: viewport_touch
        in: query
        description: Specifies whether the emulated viewport supports touch events.
        schema:
          type:
          - 'null'
          - boolean
      - name: media_type
        in: query
        description: Sets the CSS media type used while rendering the page.
        schema:
