    RequestOverride:
      required:
      - action
      type: object
      anyOf:
      - $ref: '#/components/schemas/RequestOverrideRequestOverrideBlock'
      description: A browser request override. The action discriminator selects the rule type; currently only block is supported.
      discriminator:
        propertyName: action
        mapping:
          block: '#/components/schemas/RequestOverrideRequestOverrideBlock'
    BatchImageResult:
      required:
      - images
      type: object
      properties:
        images:
