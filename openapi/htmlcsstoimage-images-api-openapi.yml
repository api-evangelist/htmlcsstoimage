  /v1/image/{id}.{format}:
    get:
      tags:
      - Images
      summary: Render an image with a specific format
      operationId: render-image-format
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: path
        required: true
        schema:
          enum:
          - png
          - jpg
          - jpeg
          - webp
          - pdf
          type: string
      - name: width
        in: query
        description: Width to resize the rendered image
        schema:
          maximum: 5000
          minimum: 1
          type:
          - 'null'
          - integer
          format: int32
      - name: height
        in: query
        description: Height to resize the rendered image
        schema:
          maximum: 5000
          minimum: 1
          type:
          - 'null'
          - integer
          format: int32
      - name: dpi
        in: query
        description: DPI to specify in rendered image's metadata.
        schema:
          maximum: 600
          minimum: 30
          type:
          - 'null'
          - integer
          format: int32
      - name: dl
        in: query
        description: Add this to cause the rendered image to be downloaded as a file instead of being displayed
        schema:
          enum:
          - '1'
          - '0'
          type:
          - 'null'
          - string
          default: '0'
      - name: aspect_ratio
        in: query
        description: 'Define an aspect ratio to crop the rendered image to. Specify the value as x_y. When using aspect_ratio, you must include one of: [x_1 & x_2], [y_1 & y_2], [x_1 & crop_width], [y_1 & crop_height], [crop_width] or [crop_height].'
        schema:
          type:
          - 'null'
          - string
      - name: x_origin
        in: query
        description: Define the origin for cropping along the x axis. When using aspect_ratio, you can only specify one of x_origin or y_origin.
        schema:
          pattern: ^-?\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 159
          PX:
            description: 230 px
            value: 230px
          Percentage:
            description: 71%
            value: 71%
          NegativeNumeric:
            description: Negative numbers without a unit specified are assumed to be pixel measurements from the end of the axis.
            value: -88
          NegativePX:
            description: 230 px from the end of the axis.
            value: -230px
      - name: y_origin
        in: query
        description: Define the origin for cropping along the y axis. When using aspect_ratio, you can only specify one of x_origin or y_origin.
        schema:
          pattern: ^-?\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 72
          PX:
            description: 160 px
            value: 160px
          Percentage:
            description: 88%
            value: 88%
          NegativeNumeric:
            description: Negative numbers without a unit specified are assumed to be pixel measurements from the end of the axis.
            value: -16
          NegativePX:
            description: 160 px from the end of the axis.
            value: -160px
      - name: x_1
        in: query
        description: Define the x_1 position for cropping. You can specify either x_1 & x_2 or x_1 and crop_width.
        schema:
          pattern: ^-?\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 145
          PX:
            description: 222 px
            value: 222px
          Percentage:
            description: 77%
            value: 77%
          NegativeNumeric:
            description: Negative numbers without a unit specified are assumed to be pixel measurements from the end of the axis.
            value: -68
          NegativePX:
            description: 222 px from the end of the axis.
            value: -222px
      - name: x_2
        in: query
        description: Define the x_2 position for cropping. Cannot be specified with crop_width, and must have an x_1 specified.
        schema:
          pattern: ^-?\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 231
          PX:
            description: 242 px
            value: 242px
          Percentage:
            description: 11%
            value: 11%
          NegativeNumeric:
            description: Negative numbers without a unit specified are assumed to be pixel measurements from the end of the axis.
            value: -220
          NegativePX:
            description: 242 px from the end of the axis.
            value: -242px
      - name: y_1
        in: query
        description: Define the y_1 position for cropping. You can specify either y_1 & y_2 or y_1 and crop_height.
        schema:
          pattern: ^-?\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 123
          PX:
            description: 168 px
            value: 168px
          Percentage:
            description: 45%
            value: 45%
          NegativeNumeric:
            description: Negative numbers without a unit specified are assumed to be pixel measurements from the end of the axis.
            value: -78
          NegativePX:
            description: 168 px from the end of the axis.
            value: -168px
      - name: y_2
        in: query
        description: Define the y_2 position for cropping. Cannot be specified with crop_height, and must have a y_1 specified.
        schema:
          pattern: ^-?\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 100
          PX:
            description: 133 px
            value: 133px
          Percentage:
            description: 33%
            value: 33%
          NegativeNumeric:
            description: Negative numbers without a unit specified are assumed to be pixel measurements from the end of the axis.
            value: -67
          NegativePX:
            description: 133 px from the end of the axis.
            value: -133px
      - name: crop_width
        in: query
        description: Define the width for cropping. Cannot be specified with crop_height, and must have a x_1 specified.
        schema:
          pattern: ^\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
          description: Use either a number, a percentage like 30.5% or a px measure like 100px.
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 19
          PX:
            description: 100 px wide
            value: 100px
          Percentage:
            description: 81% of the image's width
            value: 81%
      - name: crop_height
        in: query
        description: Define the x_2 position for cropping. Cannot be specified with crop_width, and must have a y_1 specified.
        schema:
          pattern: ^\d+(\.\d+)?(%|px)?$
          type:
          - 'null'
          - string
        examples:
          Numeric:
            description: Numbers without a unit specified are assumed to be pixel measurements.
            value: 44
          PX:
            description: 96 px high
            value: 96px
          Percentage:
            description: 52% of the image's height
            value: 52%
