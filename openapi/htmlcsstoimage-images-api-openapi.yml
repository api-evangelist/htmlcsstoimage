      parameters:
      - name: api_id
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: path
        description: An HMAC encoded token of your API key and the parameters specified in your query params. See https://docs.htmlcsstoimage.com/getting-started/create-and-render/#understanding-hmac-authentication for more information.
        required: true
        schema:
          title: Token
          type: string
      - name: format
        in: path
        description: The format of the image to return. If this field is omitted, it defaults to `png`.
        schema:
          title: Format
          enum:
          - png
          - jpg
          - webp
          - pdf
          type:
          - 'null'
          - string
          default: png
      - name: css
        in: query
        description: CSS used to style the rendered HTML.
        schema:
          type:
          - 'null'
          - string
      - name: device_scale
        in: query
        description: Adjusts the pixel ratio used for the screenshot.
        schema:
          maximum: 3
          minimum: 0.1
          type:
          - 'null'
          - number
          format: double
      - name: full_screen
        in: query
        description: Take a screenshot of the entire screen after scrolling down and back to the top.
        schema:
          type:
          - 'null'
          - boolean
      - name: google_fonts
        in: query
        description: Google fonts to load. Separate multiple fonts with a pipe, such as 'Roboto|OpenSans', and set font-family in the CSS to use them.
        schema:
          type:
          - 'null'
          - string
      - name: html
        in: query
        description: HTML to render and take a screenshot of. HTML fragments are rendered in a wrapper document unless a complete HTML document is supplied.
        schema:
          type:
          - 'null'
          - string
      - name: max_wait_ms
        in: query
        description: Sets a limit on how long to wait before taking the screenshot when the page continues loading irrelevant content.
        schema:
          maximum: 10000
          minimum: 500
          type:
          - 'null'
          - integer
          format: int32
      - name: ms_delay
        in: query
        description: Adds extra time in milliseconds before taking the screenshot so JavaScript can execute.
        schema:
          maximum: 10000
          minimum: 0
          type:
          - 'null'
          - integer
          format: int32
      - name: render_when_ready
        in: query
        description: Waits until the page signals that the screenshot is ready. The image fails if the readiness signal is never sent.
        schema:
          type:
          - 'null'
          - boolean
      - name: selector
        in: query
        description: A CSS selector for an element in the HTML. We’ll crop the image to this specific element.
        schema:
          type:
          - 'null'
          - string
      - name: url
        in: query
        description: Public HTTP or HTTPS URL to capture.
        schema:
          type:
          - 'null'
          - string
      - name: viewport_height
        in: query
        description: Sets the height of Chrome's viewport and disables automatic cropping.
        schema:
          maximum: 6000
          minimum: 1
          type:
          - 'null'
          - integer
          format: int32
      - name: viewport_width
        in: query
        description: Sets the width of Chrome's viewport and disables automatic cropping.
        schema:
          maximum: 6000
          minimum: 1
          type:
          - 'null'
          - integer
          format: int32
      - name: disable_twemoji
        in: query
        description: Twemoji is enabled by default. Set true to disable automatic emoji replacement and use the supplied fonts or native emoji fonts instead. Omitted, null, or false keeps Twemoji enabled.
        schema:
          type:
          - 'null'
          - boolean
      - name: max_render_once
        in: query
        description: Ensure the image is only ever rendered and saved one time. This is an advanced option not applicable to most requests.
        schema:
          type:
          - 'null'
          - boolean
      - name: color_scheme
        in: query
        description: Sets Chrome's preferred color scheme.
        schema:
          enum:
          - light
          - dark
          type:
          - 'null'
          - string
      - name: timezone
        in: query
        description: Sets the IANA timezone used by Chrome while rendering.
        schema:
          type:
          - 'null'
          - string
      - name: block_consent_banners
        in: query
        description: Attempt to block cookie/consent banners from displaying.
        schema:
          type:
          - 'null'
          - boolean
      - name: identify_as_hcti
        in: query
        description: Identify the top-level page navigation as an HCTI screenshot request using the X-HCTI-SCREENSHOT header.
        schema:
          type:
          - 'null'
          - boolean
      - name: headers
        in: query
        description: HTTP headers to include on top-level page navigations to the requested URL's origin and any additional_header_origins. Supports up to 20 headers with names up to 512 ASCII characters and values up to 8192 UTF-8 bytes. For GET and form-encoded requests, repeat this parameter using the format `headers=name:value`.
        schema:
          type: array
          items:
            type: string
      - name: additional_header_origins
        in: query
        description: Additional exact HTTP or HTTPS origins allowed to receive custom headers. Supports up to 20 unique origins of up to 512 UTF-8 bytes each. Origins must use the format scheme://host[:port] without a path; duplicates are ignored. For GET and form-encoded requests, repeat this parameter for each origin.
        schema:
          type: array
          items:
            type: string
            format: uri
      - name: include_headers_on_subrequests
        in: query
