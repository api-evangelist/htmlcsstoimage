openapi: 3.2.0
info:
  title: HTML/CSS to Image Storage Destinations API
  description: Capture website screenshots, render HTML/CSS, or create templated graphics. Use MCP with AI, no-code automation, or the REST API. No browsers needed.
  version: 1.0.0
servers:
- url: https://hcti.io
security:
- basic: []
tags:
- name: Storage Destinations
paths:
  /v1/storage-destinations:
    post:
      tags:
      - Storage Destinations
      summary: Create a storage destination
      description: 'Tests the connection before saving. Enabled destinations require a successful write test. Explicitly disabled destinations may be saved after a failed test; the response includes the test result. Secret access keys are never returned.


        **Rate limit:** 20 requests per minute per organization, shared across all operations in the `storage-destination:write` group and all API keys belonging to that organization.'
      operationId: create-storage-destination
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateStorageDestinationRequest'
        required: true
      responses:
        '429':
          description: Too Many Requests
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:write";q=20;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:write";r=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '200':
          description: OK
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:write";q=20;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:write";r=19'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageDestination'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
      x-badges:
      - name: Requires storage_destinations:create_update
        position: after
        color: '#64748b'
      x-required-permissions:
      - storage_destinations:create_update
      x-rate-limit:
        group: storage-destination:write
        limit: 20
        window_seconds: 60
        scope: organization
    get:
      tags:
      - Storage Destinations
      summary: List storage destinations
      description: 'Returns destinations in descending creation order, including disabled destinations. Pass pagination.next_page_start as page_start to continue; null indicates the final page. Secret access keys are never returned.


        **Rate limit:** 100 requests per minute per organization, shared across all operations in the `storage-destination:read` group and all API keys belonging to that organization.'
      operationId: list-storage-destinations
      parameters:
      - name: count
        in: query
        description: Maximum number of destinations to return, from 1 to 100. Defaults to 10.
        schema:
          maximum: 100
          minimum: 1
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
          default: 10
      - name: page_start
        in: query
        description: pagination.next_page_start from the previous response. Omit for the first page.
        schema:
          type: string
      responses:
        '429':
          description: Too Many Requests
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:read";q=100;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:read";r=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '200':
          description: OK
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:read";q=100;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:read";r=99'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListBaseOfStorageDestinationAndstring'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
      x-badges:
      - name: Requires storage_destinations:read
        position: after
        color: '#64748b'
      x-required-permissions:
      - storage_destinations:read
      x-rate-limit:
        group: storage-destination:read
        limit: 100
        window_seconds: 60
        scope: organization
  /v1/storage-destinations/{id}:
    post:
      tags:
      - Storage Destinations
      summary: Update a storage destination
      description: 'Replaces the configuration. Omitted optional settings are cleared or reset, except a secret explicitly retained using retain_secret_access_key: true with unchanged provider and access key ID. Changed connections and re-enabling trigger a write test; an enabled request is not saved if that test fails. Metadata-only changes do not require a test. After a plan downgrade, only disabling is accepted and other submitted changes are ignored.


        **Rate limit:** 20 requests per minute per organization, shared across all operations in the `storage-destination:write` group and all API keys belonging to that organization.'
      operationId: update-storage-destination
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateStorageDestinationRequest'
        required: true
      responses:
        '429':
          description: Too Many Requests
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:write";q=20;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:write";r=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '200':
          description: OK
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:write";q=20;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:write";r=19'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageDestination'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
      x-badges:
      - name: Requires storage_destinations:create_update
        position: after
        color: '#64748b'
      x-required-permissions:
      - storage_destinations:create_update
      x-rate-limit:
        group: storage-destination:write
        limit: 20
        window_seconds: 60
        scope: organization
    get:
      tags:
      - Storage Destinations
      summary: Get a storage destination
      description: '**Rate limit:** 100 requests per minute per organization, shared across all operations in the `storage-destination:read` group and all API keys belonging to that organization.'
      operationId: get-storage-destination
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '429':
          description: Too Many Requests
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:read";q=100;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:read";r=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '200':
          description: OK
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:read";q=100;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:read";r=99'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageDestination'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
      x-badges:
      - name: Requires storage_destinations:read
        position: after
        color: '#64748b'
      x-required-permissions:
      - storage_destinations:read
      x-rate-limit:
        group: storage-destination:read
        limit: 100
        window_seconds: 60
        scope: organization
    delete:
      tags:
      - Storage Destinations
      summary: Delete a storage destination
      description: '**Rate limit:** 20 requests per minute per organization, shared across all operations in the `storage-destination:write` group and all API keys belonging to that organization.'
      operationId: delete-storage-destination
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '429':
          description: Too Many Requests
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:write";q=20;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:write";r=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '204':
          description: No Content
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:write";q=20;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:write";r=19'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
      x-badges:
      - name: Requires storage_destinations:delete
        position: after
        color: '#64748b'
      x-required-permissions:
      - storage_destinations:delete
      x-rate-limit:
        group: storage-destination:write
        limit: 20
        window_seconds: 60
        scope: organization
  /v1/storage-destinations/aws-external-id:
    get:
      tags:
      - Storage Destinations
      summary: Get the AWS storage external ID
      description: 'Returns the current organization''s external_id and HCTI writer_role_arn for configuring an AWS IAM role trust policy. Use external_id as sts:ExternalId and writer_role_arn as Principal.AWS. No storage destination ID is required.


        **Rate limit:** 100 requests per minute per organization, shared across all operations in the `storage-destination:read` group and all API keys belonging to that organization.'
      operationId: get-aws-storage-external-id
      responses:
        '429':
          description: Too Many Requests
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:read";q=100;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:read";r=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '200':
          description: OK
          headers:
            RateLimit-Policy:
              description: 'The shared organization quota policy: policy name, request allowance (q), and sliding-window length in seconds (w).'
              schema:
                type: string
              example: '"storage-destination:read";q=100;w=60'
            RateLimit:
              description: The policy name and remaining requests (r) after this rate-limit check. Concurrent requests share this allowance; it does not guarantee subsequent requests will be accepted.
              schema:
                type: string
              example: '"storage-destination:read";r=99'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsStorageExternalId'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResult'
      x-badges:
      - name: Requires storage_destinations:create_update
        position: after
        color: '#64748b'
      x-required-permissions:
      - storage_destinations:create_update
      x-rate-limit:
        group: storage-destination:read
        limit: 100
        window_seconds: 60
        scope: organization
components:
  schemas:
    StorageDestinationConnectionInfo:
      title: Storage Connection Info
      required:
      - provider
      type: object
      anyOf:
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_AwsS3'
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_CloudflareR2'
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_BackblazeB2'
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_DigitalOceanSpaces'
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_Wasabi'
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_GoogleCloudStorage'
      - $ref: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_OtherS3Compatible'
      description: Provider-specific storage connection details. Secret access keys are never returned.
      discriminator:
        propertyName: provider
        mapping:
          aws_s3: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_AwsS3'
          cloudflare_r2: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_CloudflareR2'
          backblaze_b2: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_BackblazeB2'
          digitalocean_spaces: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_DigitalOceanSpaces'
          wasabi: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_Wasabi'
          google_cloud_storage: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_GoogleCloudStorage'
          other_s3_compatible: '#/components/schemas/StorageDestinationConnectionInfoStorageDestinationConnectionInfo_OtherS3Compatible'
    StorageDestinationConnectionInfoStorageDestinationConnectionInfo_DigitalOceanSpaces:
      title: DigitalOcean Spaces Connection Info
      required:
      - region
      - access_key_id
      - bucket
      properties:
        provider:
          enum:
          - digitalocean_spaces
          type: string
        region:
          description: Region containing the Space, for example nyc3.
          $ref: '#/components/schemas/DigitalOceanStorageRegion'
        access_key_id:
          maxLength: 512
          type: string
          description: S3-compatible access key ID. For Google Cloud Storage, use an HMAC access ID beginning with GOOG.
        bucket:
          maxLength: 255
          type: string
          description: Name of the existing bucket or Space. HCTI does not create it.
        key_prefix:
          maxLength: 1024
          type:
          - 'null'
          - string
          description: Optional prefix for object keys within the bucket. Omitted or null uses the bucket root.
      description: Connection details for DigitalOcean Spaces.
    PaginatedListBaseOfStorageDestinationAndstring:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageDestination'
        pagination:
          $ref: '#/components/schemas/PaginationInfoOfstring'
    DigitalOceanStorageRegion:
      enum:
      - nyc3
      - ams3
      - sfo2
      - sfo3
      - sgp1
      - lon1
      - fra1
      - tor1
      - blr1
      - syd1
      - atl1
      - ric1
      - mkc1
    StorageDestinationConnectionInfoStorageDestinationConnectionInfo_Wasabi:
      title: Wasabi Connection Info
      required:
      - region
      - access_key_id
      - bucket
      properties:
        provider:
          enum:
          - wasabi
          type: string
        region:
          description: Region containing the bucket, for example us-east-1.
          $ref: '#/components/schemas/WasabiStorageRegion'
        access_key_id:
          maxLength: 512
          type: string
          description: S3-compatible access key ID. For Google Cloud Storage, use an HMAC access ID beginning with GOOG.
        bucket:
          maxLength: 255
          type: string
          description: Name of the existing bucket or Space. HCTI does not create it.
        key_prefix:
          maxLength: 1024
          type:
          - 'null'
          - string
          description: Optional prefix for object keys within the bucket. Omitted or null uses the bucket root.
      description: Connection details for Wasabi.
    StorageDestinationConnectionRequestStorageDestinationConnectionRequest_DigitalOceanSpaces:
      title: DigitalOcean Spaces Connection Request
      required:
      - region
      - access_key_id
      - bucket
      properties:
        provider:
          enum:
          - digitalocean_spaces
          type: string
        region:
          description: Region containing the Space, for example nyc3.
          $ref: '#/components/schemas/DigitalOceanStorageRegion'
        access_key_id:
          maxLength: 512
          type: string
          description: S3-compatible access key ID. For Google Cloud Storage, use an HMAC access ID beginning with GOOG.
        secret_access_key:
          maxLength: 990
          type:
          - 'null'
          - string
          description: 'Secret access key, required on create and when changing provider or access key ID. On update, omitted or null is allowed only with retain_secret_access_key: true and unchanged provider and access key ID. A supplied secret replaces it unless retain_secret_access_key is explicitly true. Up to 990 characters and 996 UTF-8 bytes.'
        retain_secret_access_key:
          type:
          - 'null'
          - boolean
          description: Retain the existing secret access key. Only true retains the secret. Omitted, null, or false requires a supplied secret, including on updates. Explicit true requires existing credentials with unchanged provider and access key ID, and cannot be combined with a supplied secret. False requires a replacement secret, even when disabled.
        bucket:
          maxLength: 255
          type: string
          description: Name of the existing bucket or Space. HCTI does not create it.
        key_prefix:
          maxLength: 1024
          type:
          - 'null'
          - string
          description: Optional prefix for object keys within the bucket. Omitted or null uses the bucket root.
      description: Connection settings for DigitalOcean Spaces.
    StorageDestinationConnectionRequestStorageDestinationConnectionRequest_OtherS3Compatible:
      title: Other S3-Compatible Connection Request
      required:
      - endpoint
      - access_key_id
      - bucket
      properties:
        provider:
          enum:
          - other_s3_compatible
          type: string
        endpoint:
          maxLength: 512
          type: string
          description: Public HTTPS endpoint of the S3-compatible service. Do not include a path, query string, fragment, or credentials.
        region:
          maxLength: 64
          type:
          - 'null'
          - string
          description: Signing region expected by the service. Omit or set to null to use us-east-1.
        force_path_style:
          type:
          - 'null'
          - boolean
          description: Whether to put the bucket name in the URL path instead of the hostname. Omitted or null defaults to true.
        access_key_id:
          maxLength: 512
          type: string
          description: S3-compatible access key ID. For Google Cloud Storage, use an HMAC access ID beginning with GOOG.
        secret_access_key:
          maxLength: 990
          type:
          - 'null'
          - string
          description: 'Secret access key, required on create and when changing provider or access key ID. On update, omitted or null is allowed only with retain_secret_access_key: true and unchanged provider and access key ID. A supplied secret replaces it unless retain_secret_access_key is explicitly true. Up to 990 characters and 996 UTF-8 bytes.'
        retain_secret_access_key:
          type:
          - 'null'
          - boolean
          description: Retain the existing secret access key. Only true retains the secret. Omitted, null, or false requires a supplied secret, including on updates. Explicit true requires existing credentials with unchanged provider and access key ID, and cannot be combined with a supplied secret. False requires a replacement secret, even when disabled.
        bucket:
          maxLength: 255
          type: string
          description: Name of the existing bucket or Space. HCTI does not create it.
        key_prefix:
          maxLength: 1024
          type:
          - 'null'
          - string
          description: Optional prefix for object keys within the bucket. Omitted or null uses the bucket root.
      description: Connection settings for another S3-compatible provider.
    StorageDestinationConnectionRequestStorageDestinationConnectionRequest_AwsS3:
      title: AWS S3 Connection Request
      required:
      - region
      - role_arn
      - bucket
      properties:
        provider:
          enum:
          - aws_s3
          type: string
        region:
          description: AWS region containing the bucket, for example us-east-1.
          $ref: '#/components/schemas/AwsStorageRegion'
        role_arn:
          maxLength: 2048
          type: string
          description: ARN of the IAM role HCTI assumes to access the bucket. Configure its trust policy for this organization before saving.
        bucket:
          maxLength: 255
          type: string
          description: Name of the existing bucket or Space. HCTI does not create it.
        key_prefix:
          maxLength: 1024
          type:
          - 'null'
          - string
          description: Optional prefix for object keys within the bucket. Omitted or null uses the bucket root.
      description: Connection settings for Amazon S3.
    StorageDestinationConnectionInfoStorageDestinationConnectionInfo_OtherS3Compatible:
      title: Other S3-Compatible Connection Info
      required:
      - endpoint
      - access_key_id
      - bucket
      properties:
        provider:
          enum:
          - other_s3_compatible
          type: string
        endpoint:
          maxLength: 512
          type: string
          description: Public HTTPS endpoint of the S3-compatible service. Do not include a path, query string, fragment, or credentials.
        region:
          maxLength: 64
          type:
          - 'null'
          - string
          description: Signing region expected by the service. Omit or set to null to use us-east-1.
        force_path_style:
          type:
          - 'null'
          - boolean
          description: Whether to put the bucket name in the URL path instead of the hostname. Omitted or null defaults to true.
        access_key_id:
          maxLength: 512
          type: string
          description: S3-compatible access key ID. For Google Cloud Storage, use an HMAC access ID beginning with GOOG.
        bucket:
          maxLength: 255
          type: string
          description: Name of the existing bucket or Space. HCTI does not create it.
        key_prefix:
          maxLength: 1024
          type:
          - 'null'
          - string
          description: Optional prefix for object keys within the bucket. Omitted or null uses the bucket root.
      description: Connection details for another S3-compatible provider.
    StorageDestinationConnectionInfoStorageDestinationConnectionInfo_GoogleCloudStorage:
      title: Google Cloud Storage Connection Info
      required:
      - access_key_id
      - bucket
      properties:
        provider:
          enum:
          - google_cloud_storage
