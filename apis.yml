name: HTML/CSS to Image
kind: company
description: HTML/CSS to Image (HCTI) is a REST API that renders HTML, CSS, and JavaScript into high quality
  images (PNG, JPG, WebP, PDF). Send markup or a URL to the API and receive a permanent, hosted image
  URL. It supports reusable templates with variable substitution and HMAC-signed URLs for generating images
  from a simple GET request.
